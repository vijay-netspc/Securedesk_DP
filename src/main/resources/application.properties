spring.application.name=securedesk

# ---- MySQL Database ----
# Falls back to your local MariaDB when these env vars aren't set (i.e. when
# running locally with `mvn spring-boot:run`). On a hosting platform, set
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as environment variables
# instead of editing this file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/securedesk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
# Render (and most hosts) inject a PORT env var and expect the app to bind
# to it; 8080 remains the default for local runs.
server.port=${PORT:8080}
